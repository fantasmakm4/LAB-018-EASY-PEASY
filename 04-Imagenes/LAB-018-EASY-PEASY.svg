<text x="1224" y="848" font-family="sans-serif" font-size="16" fill="#f2f4f8">Acceso como boring y euid 0 confirmado.</text>
<text x="1224" y="872" font-family="sans-serif" font-size="16" fill="#f2f4f8">User flag y root flag recuperadas.</text>
