<text x="837" y="398" font-family="sans-serif" font-size="18" fill="#f2f4f8">/hidden/whatever → flag 1</text>
<text x="837" y="425" font-family="sans-serif" font-size="18" fill="#f2f4f8">Base64 en HTML oculto</text>
<text x="837" y="452" font-family="sans-serif" font-size="18" fill="#f2f4f8">Apache: User-Agent + hash → flag 2</text>
