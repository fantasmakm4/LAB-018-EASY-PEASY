<text x="38" y="848" font-family="sans-serif" font-size="16" fill="#f2f4f8">robots.txt y rutas ocultas revelan pistas.</text>
<text x="38" y="872" font-family="sans-serif" font-size="16" fill="#f2f4f8">Cron root ejecuta un script modificable por boring.</text>
<text x="38" y="896" font-family="sans-serif" font-size="16" fill="#f2f4f8">John no abrió easypeasy.txt; CVE no confirmada.
</text>
