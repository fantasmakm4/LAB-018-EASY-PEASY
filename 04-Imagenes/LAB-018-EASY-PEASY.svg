<text x="1254" y="599" font-family="monospace" font-size="15" fill="#55ff66">/tmp/rootbash -p</text>
<text x="1254" y="628" font-family="sans-serif" font-size="18" fill="#f2f4f8">id: uid=1000 · euid=0(root)</text>
<text x="1254" y="657" font-family="sans-serif" font-size="18" fill="#f2f4f8">/root/.root.txt leído</text>
<text x="1254" y="686" font-family="sans-serif" font-size="18" fill="#f2f4f8">3 web flags + user + root</text>
<text x="1254" y="722" font-family="sans-serif" font-size="16" fill="#f2f4f8">Cinco flags recuperadas · máquina completada</text>
