<text x="837" y="599" font-family="sans-serif" font-size="18" fill="#f2f4f8">Cron ejecuta cada minuto como root</text>
<text x="837" y="626" font-family="sans-serif" font-size="16" fill="#f2f4f8">/var/www/.mysecretcronjob.sh</text>
<text x="837" y="653" font-family="sans-serif" font-size="18" fill="#f2f4f8">Script modificable por boring</text>
<text x="837" y="680" font-family="monospace" font-size="15" fill="#55ff66">cp bash + chmod u+s → /tmp/rootbash</text>
<text x="837" y="721" font-family="sans-serif" font-size="16" fill="#f2f4f8">Configuración débil de cron/SUID</text>
