<text x="580" y="817" font-family="sans-serif" font-size="22" font-weight="900" fill="#fff"><tspan fill="#47ff55">✓</tspan><tspan dx="12">RECOMENDACIONES DE SEGURIDAD</tspan></text>
<text x="580" y="848" font-family="sans-serif" font-size="16" fill="#f2f4f8">No usar robots.txt para controlar el acceso.</text>
<text x="580" y="872" font-family="sans-serif" font-size="16" fill="#f2f4f8">Scripts root: propiedad root y sin escritura de usuarios.</text>
<text x="580" y="896" font-family="sans-serif" font-size="16" fill="#f2f4f8">Auditar tareas cron, SSH y directorios publicados.</text>
